[package]
name = "who-fic-icd-api"
description = "Async client for the WHO ICD-API (id.who.int) — the live-data companion to who-fic-icd"
keywords = ["who", "icd", "icd10", "icd11", "health"]
categories = ["science", "api-bindings"]
version = "0.1.2"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
who-fic-icd = { workspace = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
