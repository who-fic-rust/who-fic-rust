[package]
name = "who-fic-icd-api"
description = "Async client for the WHO ICD-API (id.who.int) — the live-data companion to who-fic-icd"
keywords = ["who", "icd", "icd10", "icd11", "health"]
categories = ["science", "api-bindings"]
version = "0.2.1"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# The ring provider, so reqwest's `rustls` feature (aws-lc-rs) is not needed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
who-fic-icd = { workspace = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
