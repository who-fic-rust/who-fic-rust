[package]
name = "who-fic"
description = "World Health Organization (WHO) Family of International Classifications (FIC): ICD, ICF, ICHI"
keywords = ["who", "icd", "icf", "ichi", "health"]
categories = ["science", "parser-implementations"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["icd", "icf", "ichi"]
icd = ["dep:who-fic-icd"]
icf = ["dep:who-fic-icf"]
ichi = ["dep:who-fic-ichi"]
serde = ["who-fic-icd?/serde", "who-fic-icf?/serde", "who-fic-ichi?/serde"]
claml = ["who-fic-icd?/claml"]
linearization = ["who-fic-icd?/linearization", "who-fic-icf?/linearization", "who-fic-ichi?/linearization"]

[dependencies]
who-fic-icd = { workspace = true, optional = true }
who-fic-icf = { workspace = true, optional = true }
who-fic-ichi = { workspace = true, optional = true }

[[example]]
name = "who-fic-readme"
path = "examples/readme.rs"

[dev-dependencies]
serde_json = "1.0.151"
# For the serde feature-forwarding regression tests (tests/serde_forwarding.rs):
# the same crate instances the `linearization`/`claml` features activate, so
# the tests can name the parser types the umbrella doesn't re-export.
who-fic-linearization = { workspace = true }
who-fic-claml = { workspace = true }
