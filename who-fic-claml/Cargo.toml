[package]
name = "who-fic-claml"
description = "Parser for ClaML (ISO 13120), the XML format WHO distributes ICD-10 in"
keywords = ["who", "icd10", "claml", "xml", "health"]
categories = ["science", "parser-implementations"]
version = "0.1.1"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[[example]]
name = "who-fic-claml-readme"
path = "examples/readme.rs"

[dev-dependencies]
serde_json = "1.0"
