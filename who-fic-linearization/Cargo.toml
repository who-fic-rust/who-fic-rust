[package]
name = "who-fic-linearization"
description = "Parser for WHO's \"Simplified Linearization Output\" TSV export format (used by ICD-11, ICF, and ICHI)"
keywords = ["who", "icd11", "icf", "ichi", "health"]
categories = ["science", "parser-implementations"]
version = "0.1.0"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0"
